# Included in the server block and in every location that sets its own add_header
# (nginx drops inherited add_header directives as soon as a location defines one).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Written by entrypoint.sh: the CSP with connect-src from VITE_API.
include /tmp/csp.conf;
