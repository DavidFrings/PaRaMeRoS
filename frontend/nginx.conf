events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;

    server {
        listen 80;
        # Docker DNS: resolve `api` per request so nginx starts without the API and follows IP changes
        resolver 127.0.0.11 valid=30s ipv6=off;
        root /usr/share/nginx/html;

        include /etc/nginx/security_headers.conf;

        location ~ \.(webp|jxl|mp4|webm|xml|webmanifest|ico|svg|woff2)$ {
            include /etc/nginx/security_headers.conf;
            add_header Cache-Control "public";
        }

        location = /config.js {
            include /etc/nginx/security_headers.conf;
            add_header Cache-Control "no-cache";
        }

        # ^~ so the static-asset regex above cannot win and drop `immutable`
        location ^~ /uploads/ {
            include /etc/nginx/security_headers.conf;
            add_header Cache-Control "public, immutable";
        }

        location = /sitemap.xml {
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream/sitemap.xml;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
