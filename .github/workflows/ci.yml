name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── API ─────────────────────────────────────────────────────────────────────

  # fmt, clippy, test (without DB: those tests skip), doc and MSRV check.
  # Required check in the ruleset: "api / result" (see scripts/github-setup.sh).
  api:
    uses: DavidFrings/rust-ci/.github/workflows/rust.yml@v1
    with:
      working-directory: api
      msrv: "1.92" # must match rust-version in api/Cargo.toml

  # Integration tests against real Postgres and Redis (rust-ci provides no services).
  api-test:
    name: "API / Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
      # Missing URLs fail the tests here instead of skipping them
      REQUIRE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked -- --test-threads=1

  # ── Frontend ─────────────────────────────────────────────────────────────────

  frontend-format:
    name: "Frontend / Format"
    environment: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Use pnpm ${{ vars.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ vars.PNPM_VERSION }}
          run_install: false
      - name: Use Node.js ${{ vars.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ vars.NODE_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm exec prettier --check src/

  frontend-lint:
    name: "Frontend / Lint"
    environment: Build
    needs: frontend-format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Use pnpm ${{ vars.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ vars.PNPM_VERSION }}
          run_install: false
      - name: Use Node.js ${{ vars.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ vars.NODE_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm exec eslint . --max-warnings 0

  frontend-type-check:
    name: "Frontend / Type Check"
    environment: Build
    needs: frontend-format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Use pnpm ${{ vars.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ vars.PNPM_VERSION }}
          run_install: false
      - name: Use Node.js ${{ vars.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ vars.NODE_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm run type-check

  frontend-test:
    name: "Frontend / Test"
    environment: Build
    needs: frontend-format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Use pnpm ${{ vars.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ vars.PNPM_VERSION }}
          run_install: false
      - name: Use Node.js ${{ vars.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ vars.NODE_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm test:e2e

  frontend-security-audit:
    name: "Frontend / Security Audit"
    environment: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Use pnpm ${{ vars.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ vars.PNPM_VERSION }}
          run_install: false
      - name: Use Node.js ${{ vars.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ vars.NODE_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # ── Docker ───────────────────────────────────────────────────────────────────

  docker-security:
    name: "Docker / Security Scan"
    environment: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
