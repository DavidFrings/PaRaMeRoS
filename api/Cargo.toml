[package]
name = "parameros-api"
authors = ["David Frings <dev@davidfrings.dev> (https://DavidFrings.dev)"]
version = "3.1.0"
description = "This is the API / backend from the Official PaRaMeRoS Website"
categories = ["web-programming", "api-bindings"]
homepage = "https://PaRaMeRoS.net"
license = "MPL-2.0"
repository = "https://github.com/DavidFrings/PaRaMeRoS"
rust-version = "1.92"
edition = "2024"

[lib]
name = "parameros_api"

[dependencies]
# no http2: h2 0.3 (RUSTSEC-2026-0258) has no 0.3 fix; nginx proxies HTTP/1.1
actix-web = { version = "^4.11", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws"] }
actix-multipart = "^0.8"
uuid = { version = "^1.18", features = ["serde", "v4"] }
serde = { version = "^1", features = ["derive"] }
env_logger = "^0.11"
log = "^0.4"
derive_more = "^2.0"
chrono = { version = "^0.4", features = ["serde"] }
futures = "^0.3"
dotenvy = "^0.15"
#diesel = { version = "^2.2", features = ["postgres", "r2d2"] }
diesel = { version = "^2.3", features = ["chrono", "uuid"] }
diesel-async = { version = "^0.9", features = ["postgres", "tokio", "bb8", "async-connection-wrapper"] }
diesel_migrations = "^2.3"
anyhow = "^1"
redis = { version = "^1.8", features = ["tokio-comp", "connection-manager"] }
bb8 = "^0.9"
#tokio-postgres = "^0.7"
bcrypt = "^0.19"
jsonwebtoken = { version = "^11.1", features = ["aws_lc_rs"] }
image = { version = "^0.25", features = ["jpeg", "png", "webp"] }
webp = "^0.3"
jpegxl-rs = { version = "^0.16", default-features = false, features = ["vendored"] }
actix-cors = "^0.7"
serde_json = "^1"
subtle = "^2"

[dev-dependencies]
actix-http = "^3"
tempfile = "^3"

# Same lints in the editor and in CI.
# Locally they are warnings; CI turns them into errors with `-D warnings`.
[lints.rust]
# `deny` instead of `forbid` so a justified #[allow(unsafe_code)] stays possible
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# From the Google Rust Style Guide
undocumented_unsafe_blocks = "warn"
# Leftover debug code must not land in main
dbg_macro = "warn"
todo = "warn"
